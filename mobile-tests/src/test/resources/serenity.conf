webdriver{
    driver=appium
    timeouts.implicitlywait=1000
    wait.for.timeout=16000
}

appium{
    hub = "http://127.0.0.1:4723/"
    deviceName="mobile_emulator"

    # Ruta del APK. build.gradle calcula un valor por defecto (la ruta
    # del propio APK dentro de este proyecto) y lo expone como variable
    # de entorno APP_PATH antes de arrancar los tests -- así que esto
    # funciona clonando el repo y corriendo ./gradlew test, sin
    # configurar nada a mano. Si defines tu propia variable de entorno
    # APP_PATH antes del build, esa gana sobre el valor por defecto
    # (ver el bloque "test { environment ... }" en build.gradle).
    app = ${APP_PATH}

    fullReset = false
    noReset = false
    appPackage="com.swaglabsmobileapp"
    appActivity="com.swaglabsmobileapp.MainActivity"
    platformName="android"
    automationName="UIAutomator2"
    autoGrantPermissions=true
    nativeWebScreenshot=true
    newCommandTimeout=120
}

serenity{
    project.name= "Simon Movilidad - Suite Movil (SauceLabs Swag Labs)"
    test.root=src/test/resources/features
    step.delay=1000
    resized.image.width=600
    logging=VERBOSE
    take.screenshots=AFTER_EACH_STEP
    feature.file.encoding=UTF-8
    report.encoding=UTF-8
}