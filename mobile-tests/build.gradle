plugins {
    id "net.serenity-bdd.serenity-gradle-plugin" version "3.9.8"
    id 'java'
    id 'eclipse'
    id 'idea'
}

defaultTasks 'clean', 'test', 'aggregate'

repositories {
    mavenCentral {
        metadataSources {
            mavenPom()
            artifact()
        }
    }
    maven { url 'https://s01.oss.sonatype.org/content/repositories/releases/' }
    maven { url 'https://oss.sonatype.org/content/repositories/releases/' }
    maven { url 'https://jitpack.io' }
}

sourceCompatibility = 17
targetCompatibility = 17

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

ext {
    slf4jVersion = '1.7.7'
    serenityCoreVersion = '3.9.8'
    junitVersion = '5.8.2'
    assertJVersion = '3.22.0'
    logbackVersion = '1.2.10'
}

dependencies {

    testImplementation "net.serenity-bdd:serenity-core:${serenityCoreVersion}",
            "net.serenity-bdd:serenity-junit5:${serenityCoreVersion}",
            "net.serenity-bdd:serenity-screenplay:${serenityCoreVersion}",
            "net.serenity-bdd:serenity-ensure:${serenityCoreVersion}",
            "net.serenity-bdd:serenity-screenplay-webdriver:${serenityCoreVersion}",
            "net.serenity-bdd:serenity-cucumber:${serenityCoreVersion}",
            "org.junit.jupiter:junit-jupiter-api:${junitVersion}",
            "org.assertj:assertj-core:${assertJVersion}",
            "ch.qos.logback:logback-classic:${logbackVersion}"
    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:${junitVersion}"
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'io.appium:java-client:8.3.0'
    implementation 'co.com.devco.automation:automationDevcoLibrary:2.0.4'
}

test {
    testLogging.showStandardStreams = true
    systemProperties System.getProperties()

    // APP_PATH: si quien corre el build ya definió su propia variable
    // de entorno APP_PATH, se respeta tal cual. Si no, se calcula un
    // valor por defecto (el APK que ya viene incluido en este proyecto,
    // con ruta absoluta calculada por Gradle vía projectDir) -- así el
    // build funciona clonando el repo y corriendo ./gradlew test sin
    // configurar nada a mano, sin quemar una ruta fija en el código
    // (serenity.conf sigue leyendo esto como variable de entorno).
    environment "APP_PATH", System.getenv("APP_PATH") ?: "${projectDir}/2-sauceLabs.apk"
}

gradle.startParameter.continueOnFailure = true

test.finalizedBy(aggregate)